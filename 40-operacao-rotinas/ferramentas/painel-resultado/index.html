<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Resultado</title>
<link rel="icon" href="logo-continuum.png">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral com os clientes · topo com o cliente aberto e as ações · grade de cartões
   (indicadores → funil e metas + risco e confiança → projeção por verba → tabelas → histórico).
   Direção visual (referência do {{OPERADOR}}, 20/10/2026): quase preto com azul petróleo, ciano como único destaque,
   gráfico de área em degradê, barra de progresso em traços, botões em pílula. Escuro por escolha: um tema só. */
:root {
  --bg:#030303; --lado:#06090B; --card:#0A1215; --card2:#112B33; --campo:rgba(255,255,255,.035);
  --line:rgba(181,181,181,.11); --line2:rgba(86,215,253,.22);
  --ink:#FCFCFC; --ink2:#B5B5B5; --mute:#6E7A7E;
  --cyan:#56D7FD; --cyan-ink:#04161C; --cyan-l:rgba(86,215,253,.10); --cyan-m:rgba(86,215,253,.30);
  --ok:#5BE3A4; --ok-l:rgba(91,227,164,.12); --warn:#F6C25B; --warn-l:rgba(246,194,91,.12); --err:#FF7A6B; --err-l:rgba(255,122,107,.12);
  --f:'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif;
  --r:22px;
  --vidro:linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.035));
  --vidro-borda:rgba(255,255,255,.16);
  color-scheme:dark;
}
[hidden] { display:none !important; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { background:var(--bg); color:var(--ink); font-family:var(--f); }
body { font-size:14px; line-height:1.5; min-height:100vh;
  background:radial-gradient(1100px 520px at 85% -8%, rgba(17,43,51,.55), transparent 62%), radial-gradient(700px 420px at 0% 100%, rgba(17,43,51,.25), transparent 60%), var(--bg); }
button, input, select { font:inherit; color:inherit; }
table { font:inherit; }
.num { font-variant-numeric:tabular-nums; }
h1, h2, h3 { text-wrap:balance; font-weight:600; letter-spacing:-.01em; }

/* barra lateral */
.app { display:flex; min-height:100vh; }
.lateral { width:260px; flex-shrink:0; background:var(--lado); border-right:1px solid var(--line); display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; padding-block:26px; padding-left:max(18px, env(safe-area-inset-left, 0px)); padding-right:18px; }
.logo { display:flex; justify-content:center; padding:0 10px 18px; }
.logo img { width:92px; height:auto; display:block; filter:drop-shadow(0 8px 22px rgba(86,215,253,.18)); }
.secao { font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); padding:4px 12px 10px; }
#navClientes { display:grid; gap:4px; overflow-y:auto; flex:1; align-content:start; }
.item { display:flex; align-items:center; gap:12px; width:100%; border:0; background:none; text-align:left; padding:8px 12px 8px 8px; border-radius:999px; cursor:pointer; color:var(--ink2); }
.item:hover { color:var(--ink); background:rgba(255,255,255,.03); }
.item.ativo { background:rgba(255,255,255,.07); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
.item .ini { width:32px; height:32px; flex-shrink:0; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; background:rgba(255,255,255,.06); color:var(--ink2); }
.item.ativo .ini { background:var(--ink); color:var(--bg); }
.item b { display:block; font-weight:600; font-size:14px; line-height:1.25; }
.item small { display:block; font-size:12px; color:var(--mute); }
.lateral .rodape { padding-top:14px; display:grid; gap:12px; }
body.modo-cliente .secao, body.modo-cliente #navClientes, body.modo-cliente #btnNovoCliente, body.modo-cliente .menu { display:none; }
body.modo-cliente #navClientes + .rodape, body.modo-cliente .rodape { margin-top:auto; }
.link-box { display:flex; gap:8px; align-items:center; margin:6px 0; }
.link-box input { flex:1; min-width:0; font-size:13px; color:var(--cyan); }
.fixo-v { font-size:13px; color:var(--ink2); padding-top:6px; }
.modo { font-size:12px; color:var(--mute); display:flex; gap:8px; align-items:flex-start; }
.modo i { width:8px; height:8px; border-radius:50%; background:var(--mute); margin-top:5px; flex-shrink:0; }
.modo.nuvem i { background:var(--cyan); box-shadow:0 0 8px var(--cyan); }

/* corpo */
.corpo { flex:1; min-width:0; display:flex; flex-direction:column; }
.topo { position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:rgba(3,3,3,.82); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  display:flex; gap:14px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--line);
  padding-block:18px; padding-left:32px; padding-right:max(32px, env(safe-area-inset-right, 0px)); }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg); }
.topo .titulo { margin-right:auto; min-width:0; flex:1 1 260px; }
.topo h1 { font-size:24px; line-height:1.3; }
.topo p { color:var(--ink2); font-size:13px; }
.menu { display:none; border:1px solid var(--vidro-borda); background:var(--vidro); box-shadow:inset 0 1px 1px rgba(255,255,255,.25); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-radius:14px; width:42px; height:42px; cursor:pointer; place-items:center; }
main { padding-block:26px 56px; padding-left:32px; padding-right:max(32px, env(safe-area-inset-right, 0px)); display:grid; grid-template-columns:minmax(0,1fr); gap:20px; }

.btn { position:relative; overflow:hidden; isolation:isolate; border:1px solid rgba(190,240,255,.45); color:#fff; font-weight:600; padding:10px 20px; border-radius:999px; cursor:pointer; white-space:nowrap;
  background:linear-gradient(180deg, rgba(150,232,255,.55) 0%, rgba(86,215,253,.30) 50%, rgba(30,140,180,.38) 100%);
  -webkit-backdrop-filter:blur(16px) saturate(170%); backdrop-filter:blur(16px) saturate(170%); text-shadow:0 1px 2px rgba(0,30,45,.45);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7), inset 0 -3px 8px rgba(0,50,70,.35), 0 10px 28px -10px rgba(86,215,253,.55); transition:transform .15s ease, filter .15s ease; }
.btn::before { content:""; position:absolute; z-index:-1; left:6%; right:6%; top:1px; height:52%; border-radius:999px; background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0)); pointer-events:none; }
.btn:hover { filter:brightness(1.08); transform:translateY(-1px); }
.btn:active { transform:translateY(0) scale(.98); }
.btn.contorno { color:var(--ink); border-color:var(--vidro-borda); background:var(--vidro); text-shadow:none;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.28), inset 0 -2px 6px rgba(0,0,0,.25), 0 10px 26px -14px rgba(0,0,0,.9); }
.btn.contorno::before { background:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0)); }
.btn.perigo { color:#FFD9D3; border-color:rgba(255,122,107,.5); background:linear-gradient(180deg, rgba(255,140,125,.28), rgba(255,122,107,.08)); text-shadow:none;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.25), 0 10px 26px -14px rgba(255,122,107,.5); }
.btn.perigo.armado { background:linear-gradient(180deg, rgba(255,150,135,.75), rgba(255,122,107,.45)); color:#fff; }
.btn.bloco { width:100%; }
button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }

.chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:4px 11px; border-radius:999px; background:var(--cyan-l); color:var(--cyan); }
.chip::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0; }
.chip.neutro { background:rgba(255,255,255,.05); color:var(--ink2); }
.chip.bom { background:var(--ok-l); color:var(--ok); } .chip.atencao { background:var(--warn-l); color:var(--warn); } .chip.ruim { background:var(--err-l); color:var(--err); }

/* cartões */
.grade { display:grid; gap:20px; grid-template-columns:repeat(12, minmax(0,1fr)); }
.c4 { grid-column:span 4; } .c8 { grid-column:span 8; } .c12 { grid-column:span 12; } .c3 { grid-column:span 3; }
.cartao { background:linear-gradient(180deg, rgba(22,48,57,.55), rgba(9,15,18,.96) 58%); border:1px solid rgba(255,255,255,.06); border-radius:var(--r); padding:24px 26px; min-width:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 28px 60px -28px rgba(0,0,0,.95), 0 2px 6px rgba(0,0,0,.45); transition:transform .25s ease, box-shadow .25s ease; }
.cartao:hover { transform:translateY(-2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.09), 0 36px 70px -30px rgba(0,0,0,1), 0 0 0 1px rgba(86,215,253,.08); }
.cartao > header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
.cartao h2 { font-size:17px; line-height:1.35; }
.cartao header p { color:var(--ink2); font-size:13px; margin-top:2px; }
.empilha { display:grid; gap:20px; align-content:start; }

.kpi { display:flex; flex-direction:column; gap:12px; }
.kpi .linha { display:flex; justify-content:space-between; align-items:center; gap:10px; }
.kpi .rot { color:var(--ink2); font-size:13px; }
.icone { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; flex-shrink:0; background:linear-gradient(160deg, #17424E, #0B2027); color:var(--cyan); border:1px solid rgba(86,215,253,.16); box-shadow:inset 0 1px 0 rgba(255,255,255,.08); }
.icone.ok { background:var(--ok-l); color:var(--ok); border-color:transparent; } .icone.err { background:var(--err-l); color:var(--err); border-color:transparent; }
.icone svg { width:19px; height:19px; }
.kpi .valor { font-size:28px; font-weight:600; line-height:1.15; letter-spacing:-.02em; }
.kpi .valor.neg { color:var(--err); }
.kpi .det { font-size:13px; color:var(--ink2); }
.kpi .det b { color:var(--ink); font-weight:600; }
.selo { display:inline-block; font-size:12px; font-weight:600; padding:1px 8px; border-radius:6px; margin-right:6px; }
.selo.ok { background:var(--ok-l); color:var(--ok); } .selo.err { background:var(--err-l); color:var(--err); }

/* funil e metas */
.funil { display:grid; grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr) 28px minmax(0,1fr); gap:8px; align-items:stretch; }
.passo { border:1px solid var(--line); background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.01)); box-shadow:inset 0 1px 0 rgba(255,255,255,.05); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:4px; min-width:0; }
.passo .rot { font-size:12px; color:var(--mute); text-transform:uppercase; letter-spacing:.08em; font-weight:600; }
.passo .grande-f { font-size:30px; font-weight:600; letter-spacing:-.02em; line-height:1.15; }
.passo .sub { font-size:13px; color:var(--ink2); }
.passo .meta-l { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12px; color:var(--ink2); margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
.passo .meta-l .junto { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.passo .meta-l input { width:52px; text-align:center; padding:5px 4px; font-weight:700; color:var(--cyan); }
.passo .alvo { font-size:12px; color:var(--mute); }
.passo .alvo b { color:var(--cyan); font-weight:600; }
.passo .curta { font-size:11px; color:var(--warn); font-weight:600; margin-top:4px; }
.seta-f { display:grid; place-items:center; color:var(--mute); font-size:16px; }
.valem { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; margin-top:16px; }
.iter-baixo { display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:14px; margin-top:16px; align-items:stretch; }
.iter-baixo .valem { grid-template-columns:1fr; margin-top:0; }
.barras { display:flex; gap:14px; align-items:flex-end; min-height:190px; padding:14px 16px 10px; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.02); }
.barra-c { flex:1; display:flex; flex-direction:column; align-items:center; align-self:stretch; gap:6px; min-width:0; }
.barra-t { flex:1; width:100%; display:flex; align-items:flex-end; }
.barra-t i { display:block; width:100%; border-radius:9px 9px 3px 3px; background:linear-gradient(180deg, rgba(86,215,253,.8), rgba(86,215,253,.06)); box-shadow:inset 0 1px 0 rgba(255,255,255,.4); }
.barra-t i.base { background:linear-gradient(180deg, rgba(181,181,181,.5), rgba(181,181,181,.05)); }
.barra-t i.neg { background:linear-gradient(180deg, rgba(255,122,107,.75), rgba(255,122,107,.06)); }
.barra-v { font-size:12px; font-weight:600; } .barra-v.neg { color:var(--err); }
.barra-m { font-size:12px; color:var(--mute); white-space:nowrap; }
.vale { border:1px solid var(--line); border-radius:14px; padding:14px 16px; font-size:13px; color:var(--ink2); background:rgba(255,255,255,.02); }
.vale b { display:block; font-size:20px; color:var(--ink); font-weight:600; margin:2px 0; }

/* projeção */
.controles { display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-bottom:18px; }
.ctl label { display:flex; justify-content:space-between; font-size:13px; color:var(--ink2); margin-bottom:8px; gap:8px; }
.ctl label b { color:var(--ink); }
.ctl .par { display:flex; gap:10px; align-items:center; }
input[type=range] { flex:1; accent-color:var(--cyan); height:24px; min-width:0; }
.ctl input[type=text] { width:92px; }
.cenarios { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px; margin-top:14px; }
.cen { border:1px solid var(--line); border-radius:14px; padding:14px 16px; background:rgba(255,255,255,.02); }
.cen.base { border-color:var(--line2); background:var(--cyan-l); }
.cen .t { font-size:12px; color:var(--ink2); }
.cen .v { font-size:22px; font-weight:600; margin:4px 0 2px; }
.cen .s { font-size:12px; color:var(--ink2); }
.pos { color:var(--ok); } .neg { color:var(--err); } .cap { color:var(--warn); }

.grafico { position:relative; width:100%; min-width:0; }
.grafico svg { display:block; overflow:visible; }
.grafico text { fill:var(--mute); font-size:12px; font-family:var(--f); }
.dica { position:absolute; pointer-events:none; color:var(--ink); background:rgba(14,30,36,.72); border:1px solid var(--vidro-borda); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-radius:12px; padding:8px 12px; font-size:12px; min-width:170px; transform:translate(-50%, -100%); white-space:nowrap; box-shadow:inset 0 1px 1px rgba(255,255,255,.18), 0 14px 30px -12px rgba(0,0,0,.9); }
.dica b { display:block; font-weight:600; margin-bottom:2px; }
.dica span { display:block; color:var(--ink2); }
.legenda { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--ink2); margin-top:10px; }
.legenda span { display:inline-flex; align-items:center; gap:6px; }
.legenda i { width:14px; height:3px; border-radius:2px; background:var(--cyan); }
.legenda i.banda { height:10px; background:var(--cyan-m); opacity:.6; }
.legenda i.zero { height:0; border-top:2px dashed var(--err); background:none; }
.legenda i.teto { width:10px; height:10px; border-radius:50%; background:var(--warn); }

/* risco e confiança */
.grande { font-size:30px; font-weight:600; line-height:1.15; letter-spacing:-.02em; }
.grande small { font-size:13px; font-weight:400; color:var(--ink2); letter-spacing:0; }
.tracos { display:flex; gap:3px; height:30px; margin:14px 0 8px; }
.tracos i { flex:1; border-radius:2px; background:rgba(255,255,255,.08); }
.tracos i.on { background:var(--cyan); } .tracos i.on.quente { background:var(--warn); } .tracos i.on.estoura { background:var(--err); }
.marcas { display:flex; justify-content:space-between; gap:10px; font-size:12px; color:var(--mute); flex-wrap:wrap; }
.texto { color:var(--ink2); font-size:13px; margin-top:10px; }
.texto b { color:var(--ink); font-weight:600; }
.faixa { position:relative; height:30px; margin:16px 0 6px; }
.faixa .trilho { position:absolute; left:0; right:0; top:14px; height:2px; background:var(--line); }
.faixa .int { position:absolute; top:9px; height:12px; background:var(--cyan-m); border-radius:6px; }
.faixa .ponto { position:absolute; top:4px; width:4px; height:22px; margin-left:-2px; background:var(--cyan); border-radius:2px; box-shadow:0 0 10px var(--cyan); }
.faixa .empate { position:absolute; top:0; height:30px; margin-left:-1px; border-left:2px dashed var(--err); }

/* abas e tabelas */
.abas { display:flex; gap:4px; background:var(--vidro); padding:4px; border-radius:999px; border:1px solid var(--vidro-borda); box-shadow:inset 0 1px 1px rgba(255,255,255,.18); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
.abas button { border:0; background:none; padding:6px 14px; border-radius:999px; cursor:pointer; color:var(--ink2); font-weight:600; font-size:13px; }
.abas button.ativo { color:#fff; background:linear-gradient(180deg, rgba(150,232,255,.55), rgba(40,150,190,.4)); box-shadow:inset 0 1px 1px rgba(255,255,255,.6), 0 6px 16px -8px rgba(86,215,253,.6); text-shadow:0 1px 2px rgba(0,30,45,.4); }
.rolagem { overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
th { text-align:left; font-size:12px; font-weight:500; color:var(--mute); padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
td { padding:12px; border-bottom:1px solid var(--line); white-space:nowrap; font-variant-numeric:tabular-nums; }
tr:last-child td { border-bottom:0; }
tr.destaque td { background:var(--cyan-l); }
tr.destaque td:first-child { border-radius:10px 0 0 10px; } tr.destaque td:last-child { border-radius:0 10px 10px 0; }
.mini { border:0; background:none; color:var(--mute); cursor:pointer; font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; }
.mini:hover { color:var(--err); background:var(--err-l); }
.mini.armado { color:var(--bg); background:var(--err); }
.nota { color:var(--mute); font-size:12px; margin-top:14px; max-width:84ch; }

/* vazio */
.vazio { text-align:center; padding:56px 24px; }
.vazio h2 { font-size:20px; margin-bottom:8px; }
.vazio p { color:var(--ink2); max-width:52ch; margin:0 auto 20px; }

/* formulário */
.veu { position:fixed; inset:0; background:rgba(0,0,0,.65); backdrop-filter:blur(4px); z-index:20; display:grid; place-items:center;
  padding-block:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.janela { background:linear-gradient(180deg, #0F1E23, #0A1215 60%); border:1px solid var(--line2); border-radius:var(--r); width:min(540px, 100%); max-height:100%; overflow-y:auto; padding:26px 28px; }
.janela h2 { font-size:18px; margin-bottom:4px; }
.janela > p { color:var(--ink2); font-size:13px; margin-bottom:18px; }
.campos { display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
.campos .todo { grid-column:1 / -1; }
.campos label { display:block; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:6px; }
.campos label em { font-style:normal; font-weight:400; color:var(--mute); }
.campos small { display:block; font-size:12px; color:var(--mute); margin-top:4px; }
input[type=text], input[type=date], select { width:100%; background:var(--campo); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; }
select option { background:#0A1215; }
input[type=text]:focus, input[type=date]:focus, select:focus { outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px var(--cyan-l); }
.erro { color:var(--err); font-size:13px; min-height:18px; margin-top:12px; }
.botoes { display:flex; gap:10px; justify-content:flex-end; margin-top:8px; flex-wrap:wrap; }
.botoes .esq { margin-right:auto; }
.aviso { position:fixed; right:max(20px, env(safe-area-inset-right, 0px)); bottom:max(20px, env(safe-area-inset-bottom, 0px)); color:var(--ink); background:rgba(14,30,36,.75); border:1px solid var(--vidro-borda); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); box-shadow:inset 0 1px 1px rgba(255,255,255,.2), 0 14px 30px -12px rgba(0,0,0,.9); padding:10px 18px; border-radius:999px; font-weight:600; z-index:30; }

<script>
// ---------- utilidades ----------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const lerNum = v => { const x = parseFloat(String(v ?? '').trim().replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return isFinite(x) ? x : NaN; };
const brl = v => isFinite(v) ? v.toLocaleString('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 }) : '—';
const brl2 = v => isFinite(v) ? v.toLocaleString('pt-BR', { style:'currency', currency:'BRL', minimumFractionDigits:2, maximumFractionDigits:2 }) : '—';
const pct = (v, c = 1) => isFinite(v) ? (v * 100).toLocaleString('pt-BR', { maximumFractionDigits:c }) + '%' : '—';
const dec = (v, c = 1) => isFinite(v) ? v.toLocaleString('pt-BR', { maximumFractionDigits:c }) : '—';
const campo = v => (v !== null && v !== undefined && v !== '' && isFinite(v)) ? String(v).replace('.', ',') : '';
const qtd = v => v < 10 ? dec(v, 1) : dec(Math.round(v), 0);
const dataBR = s => s ? new Date(s + 'T12:00').toLocaleDateString('pt-BR') : '';
const hoje = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const iniciais = n => (n || '?').split(/[\s·]+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('');
function avisar(t) { const a = $('aviso'); a.textContent = t; a.hidden = false; clearTimeout(avisar.t); avisar.t = setTimeout(() => a.hidden = true, 2600); }

// Faixa provável (80%). Taxa: intervalo de Wilson. Contagem sem denominador (compras no site): aproximação de Poisson.
const Z80 = 1.2816;
function wilson(k, n, z = Z80) {
  if (!(n > 0)) return [0, 1];
  const p = k / n, z2 = z * z, d = 1 + z2 / n, c = (p + z2 / (2 * n)) / d, h = z * Math.sqrt(p * (1 - p) / n + z2 / (4 * n * n)) / d;
  return [Math.max(0, c - h), Math.min(1, c + h)];
}
function poisson(k, z = Z80) { return [k > 0 ? Math.pow(Math.max(0, Math.sqrt(k) - z / 2), 2) : 0, Math.pow(Math.sqrt(k + 1) + z / 2, 2)]; }

const I = {
  lucro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>',
  margem:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg>',
  conversa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  venda:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>'
};

// Metas de iteração por mês, em percentual (pedido do {{OPERADOR}}, 20/10/2026): quanto o custo por conversa cai e quanto a taxa
// de conversão das conversas sobe. Valores de partida a calibrar com as primeiras contas (n=0).
const METAS = { custo:10, taxa:20 };
// Amostra mínima antes de tomar decisão sobre a taxa (método de iteração de CPA §7).
const AMOSTRA = { conversas:30 };

// ---------- armazenamento: o repo, pelo servidor local (servir.py); sem ele, só este navegador ----------
// Cada cliente vira clientes/<Cliente>/NN - tráfego pago/painel.json; o servidor sincroniza com a main depois de gravar.
const CHAVE = 'continuum.painelResultado.v2';
const S = { modo:'local', clientes:{}, atual:null, aba:'prazo', pronto:false, k:null, sync:'' };
function lerLocal() { try { return JSON.parse(localStorage.getItem(CHAVE)) || {}; } catch (e) { return {}; } }
function gravarLocal() { try { localStorage.setItem(CHAVE, JSON.stringify(S.clientes)); return true; } catch (e) { return false; } }
const ordenados = () => Object.keys(S.clientes).sort((a, b) => (S.clientes[a].nome || '').localeCompare(S.clientes[b].nome || '', 'pt-BR'));
// O id é a primeira palavra do nome do cliente, sem acento; o servidor acha a pasta de tráfego dele em clientes/.
function idPara(nome) {
  const base = (nome.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().match(/[a-z0-9]+/g) || ['cliente'])[0].slice(0, 30);
  let id = base, n = 2; while (S.clientes[id]) id = base + '-' + n++;
  return id;
}
async function salvarCliente(c, redesenhar = true) {
  S.clientes[c.id] = c;
  if (S.modo === 'cliente') { if (redesenhar) render(); return; } // página do cliente: só simula, nunca grava
  if (S.modo === 'repo') {
    try {
      const { id, ...corpo } = c;
      const r = await fetch('/api/clientes/' + encodeURIComponent(id), { method:'PUT', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(corpo) });
      if (!r.ok) throw new Error(r.status);
      lerEstado();
    } catch (e) { avisar('Não gravou no repo. O painel ainda está aberto pelo atalho?'); throw e; }
  } else if (!gravarLocal()) { avisar('Este navegador não deixou salvar.'); }
  if (redesenhar) render();
}
async function apagarCliente(id) {
  delete S.clientes[id];
  if (S.modo === 'repo') { try { await fetch('/api/clientes/' + encodeURIComponent(id), { method:'DELETE' }); lerEstado(); } catch (e) { avisar('Não apagou. Tente de novo.'); } }
  else gravarLocal();
  S.atual = ordenados()[0] || null; render();
}
function marcarModo() {
  const m = $('modo'); m.className = 'modo' + (S.modo === 'repo' ? ' nuvem' : '');
  $('btnConfig').hidden = S.modo !== 'repo';
  m.querySelector('span').textContent = S.modo === 'cliente'
    ? 'Painel preparado pela Continuum. Só leitura: a verba por dia pode ser simulada para cima, sem gravar nada.'
    : S.modo === 'repo'
    ? 'Salvo no repo, na pasta de tráfego de cada cliente. ' + (S.sync ? 'Sincronização: ' + S.sync + '.' : '')
    : (/^(127\.0\.0\.1|localhost)$/.test(location.hostname) || location.protocol === 'file:'
      ? 'Salvo só neste navegador. Abra pelo atalho "Painel de Resultado" para gravar no repo.'
      : 'Versão web: o que se lança aqui fica só neste navegador. Os clientes do repo abrem pelo atalho no computador.');
}
async function lerEstado() {
  try { const r = await fetch('/api/estado'); if (r.ok) { S.sync = (await r.json()).sync; marcarModo(); } } catch (e) { /* servidor fechado: fica o último estado */ }
}
// Busca gasto e conversas na Meta (servidor) e recarrega os clientes. Vendas continuam manuais.
async function atualizarMeta(avisoManual) {
  if (S.modo !== 'repo' || !Object.values(S.clientes).some(c => c.metaConta)) return;
  try {
    const r = await fetch('/api/meta/atualizar', { method:'POST' }), res = await r.json();
    if (res.erro) { if (avisoManual) avisar(res.erro); return; }
    const erros = Object.values(res.erros || {});
    if (erros.length) avisar('Meta: ' + erros.join(' · '));
    else if (avisoManual) avisar('Dados da Meta atualizados.');
    if (!(res.atualizados || []).length) return;
    const lista = await (await fetch('/api/clientes', { cache:'no-store' })).json();
    lista.forEach(c => { if (!editando) S.clientes[c.id] = c; });
    lerEstado(); if (!editando && $('veu').hidden) render();
  } catch (e) { if (avisoManual) avisar('O servidor local não respondeu.'); }
}
let editando = false; // enquanto se digita uma meta ou se arrasta um controle, nada redesenha a página inteira
async function iniciar() {
  const emb = document.getElementById('dados-cliente'); // a página do cliente traz os números dele embutidos
  if (emb) {
    const c = JSON.parse(emb.textContent);
    S.modo = 'cliente'; S.clientes = { [c.id]:c }; S.atual = c.id; S.verbaBase = +c.verbaDia || 0; S.pronto = true;
    document.body.classList.add('modo-cliente'); marcarModo(); render(); return;
  }
  try {
    const r = await fetch('/api/clientes', { cache:'no-store' });
    if (!r.ok) throw new Error(r.status);
    const lista = await r.json(); S.modo = 'repo'; S.clientes = {};
    lista.forEach(c => { S.clientes[c.id] = c; });
    lerEstado(); setInterval(lerEstado, 60000); // o pulso também mantém o servidor aberto enquanto há janela
    setTimeout(() => atualizarMeta(false), 300); setInterval(() => atualizarMeta(false), 3600000); // dados da Meta: ao abrir e a cada 60 min
  } catch (e) { S.modo = 'local'; S.clientes = lerLocal(); }
  S.atual = ordenados()[0] || null; S.pronto = true;
  marcarModo(); render();
}

// ---------- a conta ----------
// Um cliente antigo (com margem e custo fixo) é lido no formato novo: custo fixo vira assessoria; margem sai da conta.
function normal(c) {
  const ass = c.assessoria !== undefined && c.assessoria !== null && c.assessoria !== '' ? +c.assessoria : (+c.fixo || 0);
  const mt = c.metas || {};
  return { ...c, tipo:c.tipo === 'site' ? 'site' : 'conversa', ticket:+c.ticket || 0, assessoria:ass > 0 ? ass : 0,
    metas:{ custo:isFinite(+mt.custo) && mt.custo !== null ? +mt.custo : METAS.custo, taxa:isFinite(+mt.taxa) && mt.taxa !== null ? +mt.taxa : METAS.taxa }, leituras:c.leituras || [] };
}
function conta(c0) {
  const c = normal(c0);
  const ls = c.leituras.slice().sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0);
  const l = ls[ls.length - 1];
  if (!l) return null;
  const site = c.tipo === 'site', ticket = c.ticket;
  const gasto = +l.gasto, dias = +l.dias > 0 ? +l.dias : 0;
  const conv = site ? NaN : +l.conversas;
  const vendas = Math.max(0, +l.vendas || 0);
  const fat = vendas * ticket, assPer = c.assessoria * dias / 30;
  const lucroMidia = fat - gasto, lucro = lucroMidia - assPer;
  const margemMidia = fat > 0 ? lucroMidia / fat : NaN, margem = fat > 0 ? lucro / fat : NaN;
  const cpa = vendas > 0 ? gasto / vendas : Infinity, roas = fat / gasto;
  const cpConv = !site ? (+l.custo > 0 ? +l.custo : gasto / conv) : NaN; // custo por conversa: o do Gerenciador, se lançado
  const r2 = !site ? vendas / conv : NaN;                                // taxa de conversão das conversas

  // projeção: custo da unidade do topo (u), taxa até a venda (t) e a faixa provável
  let u, t, n, modo, topo;
  if (!site) { u = cpConv; t = r2; n = conv; modo = 'taxa'; topo = 'conversas'; }
  else { u = gasto; t = vendas; n = 1; modo = 'contagem'; topo = null; }
  const [tLo, tHi] = modo === 'taxa' ? wilson(vendas, n) : poisson(vendas);
  const vpr = { lo:tLo / u, base:t / u, hi:tHi / u };   // vendas por real de mídia, em cada cenário
  const taxaEmpate = modo === 'taxa' ? u / ticket : NaN;
  const mediaDia = dias > 0 ? gasto / dias : NaN;
  const vDia = +c.verbaDia > 0 ? +c.verbaDia : (mediaDia > 0 ? Math.round(mediaDia * 100) / 100 : 20);
  const D = Math.max(1, +c.horizonte || 30);
  const teto = +c.teto, tetoDia = teto > 0 ? teto / 7 : Infinity;
  const proj = (vd, d, cen = 'base') => {
    const verba = vd * d, bruto = verba * vpr[cen], cap = tetoDia * d, v = Math.min(bruto, cap);
    return { verba, topo:modo === 'taxa' ? verba / u : NaN, v, limitado:bruto > cap + 1e-9, fat:v * ticket, lucro:v * ticket - verba - c.assessoria * d / 30 };
  };
  const capVerba = isFinite(tetoDia) && vpr.base > 0 ? tetoDia / vpr.base : NaN; // verba diária em que a entrega trava
  let estado;
  if (vendas === 0) estado = ['sem venda ainda', 'atencao'];
  else if (cpa < ticket * 0.67) estado = ['a mídia se paga', 'bom'];
  else if (cpa <= ticket) estado = ['se paga, margem curta', 'atencao'];
  else estado = ['mídia no vermelho', 'ruim'];
  const conf = vendas < 5 ? ['leitura frágil', 'ruim'] : vendas < 20 ? ['leitura firmando', 'atencao'] : ['leitura firme', 'bom'];
  return { c, ls, l, site, ticket, gasto, dias, conv, vendas, fat, assPer, lucroMidia, lucro, margemMidia, margem, cpa, roas,
    cpConv, r2, u, t, n, modo, topo, tLo, tHi, vpr, taxaEmpate, mediaDia, vDia, D, teto, tetoDia, capVerba, proj, estado, conf };
}

// Três meses de iteração, na verba de hoje (30 dias). Mês 1 é a linha de base, sem meta. `liga` escolhe quais metas entram.
// Cada mês o custo por conversa cai `custo`% e a taxa sobe `taxa`% sobre a do mês anterior.
function iteracao(k, liga = { custo:true, taxa:true }) {
  const m = k.c.metas, verba = k.vDia * 30, cap = k.tetoDia * 30;
  return [0, 1, 2].map(i => {
    const a = liga.custo ? i : 0, b = liga.taxa ? i : 0;
    let cpTopo = NaN, rFim = NaN, topoN = NaN, v;
    if (!k.site) {
      cpTopo = k.cpConv * Math.pow(1 - m.custo / 100, a);
      rFim = Math.min(1, k.r2 * Math.pow(1 + m.taxa / 100, b));
      topoN = verba / cpTopo; v = topoN * rFim;
    } else {
      const cpa = k.vendas > 0 ? k.cpa * Math.pow(1 - m.custo / 100, a) : Infinity; v = isFinite(cpa) ? verba / cpa : 0;
    }
    const vc = Math.min(v, cap);
    return { i, cpTopo, rFim, topoN, v:vc, limitado:v > cap + 1e-9, cpa:v > 0 ? verba / v : Infinity, sobra:vc * k.ticket - verba - k.c.assessoria };
  });
}

// ---------- gráficos: desenhados na largura real do cartão, com texto em tamanho fixo ----------
function escala(min, max, n = 4) {
  const bruto = (max - min) / n || 1, p10 = Math.pow(10, Math.floor(Math.log10(bruto)));
  const passo = [1, 2, 2.5, 5, 10].map(x => x * p10).find(x => x >= bruto);
  const ticks = []; for (let v = Math.floor(min / passo) * passo; v <= Math.ceil(max / passo) * passo + 1e-6; v += passo) ticks.push(v);
  return ticks;
}
const brlCurto = v => Math.abs(v) >= 1000 ? 'R$ ' + dec(v / 1000, 1) + ' mil' : brl(v);
const DEF = id => `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#56D7FD" stop-opacity=".38"/><stop offset="1" stop-color="#56D7FD" stop-opacity="0"/></linearGradient></defs>`;

// Projeção: lucro em D dias conforme a verba diária. A curva sobe até o teto de entrega e desce depois dele.
function desenharProjecao(k) {
  const box = $('gProj'); if (!box) return;
  const W = Math.max(280, box.clientWidth), H = Math.round(Math.min(330, Math.max(230, W * 0.34)));
  const m = { l:70, r:24, t:36, b:36 }, iw = W - m.l - m.r, ih = H - m.t - m.b, chao = m.t + ih;
  const xMax = Math.max(+$('rVerba').max || 200, k.vDia * 1.2, isFinite(k.capVerba) ? k.capVerba * 1.6 : 0);
  const N = 80, pts = Array.from({ length:N + 1 }, (_, i) => { const vd = xMax * i / N; return { vd, b:k.proj(vd, k.D, 'base'), lo:k.proj(vd, k.D, 'lo').lucro, hi:k.proj(vd, k.D, 'hi').lucro }; });

  const topoBase = Math.max(0, ...pts.map(p => p.b.lucro)), topoHi = Math.max(0, ...pts.map(p => p.hi));
  const ticks = escala(Math.min(0, ...pts.map(p => p.lo)), Math.min(topoHi, topoBase * 1.5) || 1);
  const yMin = ticks[0], yMax = ticks[ticks.length - 1];
  const X = v => m.l + v / xMax * iw, Y = v => m.t + (yMax - v) / (yMax - yMin) * ih;
  const estreito = W < 520, xt = escala(0, xMax, estreito ? 3 : 5).filter(v => v <= xMax + 1e-6);
  const linha = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.vd).toFixed(1)},${Y(p.b.lucro).toFixed(1)}`).join('');
  const banda = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.vd).toFixed(1)},${Y(p.hi).toFixed(1)}`).join('') + pts.slice().reverse().map(p => `L${X(p.vd).toFixed(1)},${Y(p.lo).toFixed(1)}`).join('') + 'Z';
  const area = linha + `L${X(xMax)},${chao}L${X(0)},${chao}Z`;
  const hoje = k.proj(k.vDia, k.D, 'base');
  const pico = isFinite(k.capVerba) && k.capVerba < xMax ? { vd:k.capVerba, l:k.proj(k.capVerba, k.D, 'base').lucro } : null;
  const larg = Math.max(18, Math.min(34, iw / 16));
  box.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Lucro em ${k.D} dias conforme a verba por dia">
    <defs>
      <linearGradient id="gradProj" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#56D7FD" stop-opacity=".34"/><stop offset=".7" stop-color="#56D7FD" stop-opacity=".06"/><stop offset="1" stop-color="#56D7FD" stop-opacity="0"/></linearGradient>
      <linearGradient id="gradCol" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#56D7FD" stop-opacity=".22"/><stop offset="1" stop-color="#56D7FD" stop-opacity=".02"/></linearGradient>
      <marker id="seta" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L6,4 L1,7" fill="none" stroke="rgba(181,181,181,.45)" stroke-width="1.2"/></marker>
      <clipPath id="recorte"><rect x="${m.l}" y="${m.t - 2}" width="${iw}" height="${ih + 2}"/></clipPath>
      <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    </defs>
    ${ticks.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(181,181,181,.09)" stroke-dasharray="4 6"/><text x="${m.l - 12}" y="${Y(v) + 4}" text-anchor="end">${brlCurto(v)}</text>`).join('')}

// Curva suave que não passa dos pontos (monotônica, Fritsch–Carlson): não inventa pico entre duas leituras.
function curva(px, py) {
  const n = px.length;
  if (n < 3) return px.map((x, i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${py[i].toFixed(1)}`).join('');
  const dx = [], s = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = px[i + 1] - px[i]; s[i] = (py[i + 1] - py[i]) / dx[i]; }
  const t = [s[0]];
  for (let i = 1; i < n - 1; i++) t[i] = s[i - 1] * s[i] <= 0 ? 0 : 3 * (dx[i - 1] + dx[i]) / ((2 * dx[i] + dx[i - 1]) / s[i - 1] + (dx[i] + 2 * dx[i - 1]) / s[i]);
  t[n - 1] = s[n - 2];
  let d = `M${px[0].toFixed(1)},${py[0].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) d += `C${(px[i] + dx[i] / 3).toFixed(1)},${(py[i] + t[i] * dx[i] / 3).toFixed(1)} ${(px[i + 1] - dx[i] / 3).toFixed(1)},${(py[i + 1] - t[i + 1] * dx[i] / 3).toFixed(1)} ${px[i + 1].toFixed(1)},${py[i + 1].toFixed(1)}`;
  return d;
}
// Histórico: só a partir de 3 leituras; com menos, duas medidas soltas viram tendência falsa.

  const box = $('gHist'); if (!box) return;
  const val = l => +l.custo > 0 ? +l.custo : k.site ? (+l.vendas > 0 ? +l.gasto / +l.vendas : NaN) : (+l.conversas > 0 ? +l.gasto / +l.conversas : NaN);
  const ls = k.ls.filter(l => isFinite(val(l))), v = ls.map(val);
  const W = Math.max(280, box.clientWidth), H = 110, m = { l:8, r:72, t:14, b:24 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const mx = Math.max(...v) * 1.15, X = i => m.l + i / (ls.length - 1) * iw, Y = x => m.t + (mx - x) / mx * ih, u = v.length - 1;
  const d = curva(v.map((_, i) => X(i)), v.map(Y));
  box.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="${k.site ? 'Custo por venda' : 'Custo por conversa'} a cada leitura">${DEF('gradHist')}
    <path d="${d}L${X(u)},${Y(0)}L${X(0)},${Y(0)}Z" fill="url(#gradHist)"/><path d="${d}" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-linejoin="round"/>
    ${v.map((x, i) => `<circle cx="${X(i)}" cy="${Y(x)}" r="${i === u ? 5 : 3}" fill="${i === u ? 'var(--cyan)' : 'var(--card2)'}" stroke="var(--cyan)" stroke-width="2"><title>${dataBR(ls[i].data)}: ${brl2(x)}</title></circle>`).join('')}
    <text x="${X(u) + 10}" y="${Y(v[u]) + 4}" style="fill:var(--ink);font-weight:600">${brl2(v[u])}</text>
    <text x="${X(0)}" y="${H - 4}">${dataBR(ls[0].data)}</text><text x="${X(u)}" y="${H - 4}" text-anchor="end">${dataBR(ls[u].data)}</text>
  </svg>`;
}

    <div class="botoes"><button class="btn contorno" type="button" data-fechar>Cancelar</button><button class="btn" type="submit">Salvar leitura</button></div>`,
  f => {
    const data = f.get('fData'), dias = lerNum(f.get('fDias')), gasto = lerNum(f.get('fGasto')), qtd = lerNum(f.get('fQtd')), custo = lerNum(f.get('fCusto'));
    const vendas = site ? qtd : lerNum(f.get('fVendas'));
    if (!data) return 'Escolha a data da leitura.';
    if (!(gasto > 0)) return 'Preencha o valor gasto, ou o custo por resultado e a quantidade.';
    if (!(qtd >= 0) || (!site && !(qtd > 0))) return site ? 'Preencha as conversões.' : 'Preencha as conversas iniciadas: sem elas não há custo por conversa.';
    if (!site && !(vendas >= 0)) return 'Preencha as vendas do WhatsApp. Se não houve venda, escreva 0.';
    if (!site && vendas > qtd) return 'As vendas não passam do número de conversas.';
    const outras = c.leituras.filter(l => l.data !== data);
    const nova = { id:novoId(), data, dias:dias > 0 ? dias : null, gasto, vendas, custo:custo > 0 ? custo : null };
    if (!site) nova.conversas = qtd;
    const reg = { ...c0, leituras:[...outras, nova] };
    fechar(); salvarCliente(reg).then(() => avisar('Leitura salva.')).catch(() => {});
  });
  // gasto = custo × quantidade: com dois preenchidos à mão, o terceiro se completa
  const ids = ['fGasto', 'fQtd', 'fCusto'], digitados = new Set();
  const completar = () => {
    const g = lerNum($('fGasto').value), q = lerNum($('fQtd').value), cu = lerNum($('fCusto').value), conf = $('fConfere');
    const falta = ids.filter(i => !digitados.has(i));
    if (falta.length === 1) {
      const alvo = $(falta[0]);
      const v = falta[0] === 'fGasto' ? cu * q : falta[0] === 'fQtd' ? (cu > 0 ? Math.round(g / cu) : NaN) : (q > 0 ? g / q : NaN);
      alvo.value = isFinite(v) && v > 0 ? campo(Math.round(v * 100) / 100) : '';
      alvo.style.color = 'var(--cyan)';
      conf.textContent = alvo.value ? `${alvo.previousElementSibling.textContent} calculado: ${alvo.value}.` : '';
    } else if (falta.length === 0 && g > 0 && q > 0 && cu > 0) {
      const calc = g / q;
      conf.textContent = Math.abs(calc / cu - 1) > 0.02 ? `Valor gasto ÷ ${site ? 'conversões' : 'conversas'} dá ${brl2(calc)}, diferente do custo digitado. Vale o custo digitado; confira os números.` : '';
    } else conf.textContent = '';
  };
  ids.forEach(i => $(i).addEventListener('input', () => {
    if ($(i).value.trim()) digitados.add(i); else digitados.delete(i);
    $(i).style.color = '';
    completar();
  }));
}

// Compartilhar: o servidor local publica uma página só com os números deste cliente, num link secreto.
// O token da Hostinger se configura uma vez, em Configurações; aqui o botão só entrega o link.
const lerCompart = async id => (await fetch('/api/compartilhar/' + encodeURIComponent(id), { cache:'no-store' })).json();
async function formCompartilhar(c) {
  let st;
  try { st = await lerCompart(c.id); } catch (e) { avisar('O servidor local não respondeu. Abra pelo atalho.'); return; }
  if (!st.token) { avisar('Falta o token da Hostinger: configure uma vez e volte aqui.'); formConfig(); return; }
  if (!st.url) {
    avisar('Gerando o link…');
    try {
      const res = await (await fetch('/api/compartilhar/' + encodeURIComponent(c.id), { method:'POST', headers:{ 'Content-Type':'application/json' }, body:'{}' })).json();
      if (res.erro) { avisar(res.erro); return; }
      st = await lerCompart(c.id);
    } catch (e) { avisar('O servidor local não respondeu.'); return; }
  }
  abrir(`<h2>Link de ${esc(c.nome)}</h2><p>Só os números de ${esc(c.nome)}, só leitura. Quem abre pode simular mais verba por dia, sem gravar nada. A página se atualiza sozinha a cada leitura nova.</p>
    <div class="link-box"><input type="text" id="fLink" value="${esc(st.url)}" readonly aria-label="Link do cliente"><button class="btn" type="button" id="btnCopiar">Copiar</button></div>
    <p class="nota" style="margin-top:0">${st.atualizado ? 'Página atualizada em ' + esc(st.atualizado) + '.' : ''}${st.erro ? ' <span style="color:var(--err)">A última atualização falhou: ' + esc(st.erro) + '.</span>' : ''}</p>
    <div class="erro" role="alert"></div>
    <div class="botoes"><button class="btn perigo esq" type="button" id="btnParar">Parar de compartilhar</button><button class="btn contorno" type="submit">Atualizar agora</button><button class="btn contorno" type="button" data-fechar>Fechar</button></div>`,
  () => {
    const erro = $('janela').querySelector('.erro'); erro.textContent = 'Atualizando a página do cliente…';
    fetch('/api/compartilhar/' + encodeURIComponent(c.id), { method:'POST', headers:{ 'Content-Type':'application/json' }, body:'{}' })
      .then(r => r.json()).then(res => { if (res.erro) { erro.textContent = res.erro; return; } fechar(); formCompartilhar(c); avisar('Página do cliente atualizada.'); })
      .catch(() => { erro.textContent = 'O servidor local não respondeu.'; });
  });
  const campoLink = $('fLink');
  const copiar = () => navigator.clipboard.writeText(campoLink.value).then(() => avisar('Link copiado.')).catch(() => { campoLink.focus(); campoLink.select(); avisar('Link selecionado: copie com Ctrl+C.'); });
  $('btnCopiar').onclick = copiar;
  copiar();
  const pa = $('btnParar');
  pa.onclick = () => {
    if (!pa.classList.contains('armado')) { pa.classList.add('armado'); pa.textContent = 'Confirmar: desativa o link'; setTimeout(() => { pa.classList.remove('armado'); pa.textContent = 'Parar de compartilhar'; }, 4000); return; }
    fetch('/api/compartilhar/' + encodeURIComponent(c.id), { method:'DELETE' }).then(r => r.json())
      .then(res => { if (res.erro) { $('janela').querySelector('.erro').textContent = res.erro; return; } fechar(); avisar('Link desativado.'); })
      .catch(() => { $('janela').querySelector('.erro').textContent = 'O servidor local não respondeu.'; });
  };
}
async function formConfig() {
  let cfg;
  try { cfg = await (await fetch('/api/config', { cache:'no-store' })).json(); } catch (e) { avisar('O servidor local não respondeu. Abra pelo atalho.'); return; }
  abrir(`<h2>Configurações</h2><p>Vale para todos os clientes.</p>
    <div class="campos"><div class="todo"><label for="fToken">Token da API da Hostinger</label>
      <input type="text" id="fToken" name="fToken" autocomplete="off" placeholder="${cfg.token ? 'configurado: cole outro só para trocar' : 'cole o token aqui'}">
      <small>${cfg.token ? '<span style="color:var(--ok)">Configurado.</span> ' : ''}Um só, da sua conta, para todos os clientes. hPanel → Perfil → API. Fica salvo só neste computador, fora do repo, e é conferido com a Hostinger antes de salvar.</small></div>
      <div class="todo"><label for="fTokenMeta">Token da Meta (usuário do sistema)</label>
      <input type="text" id="fTokenMeta" name="fTokenMeta" autocomplete="off" placeholder="${cfg.meta ? 'configurado: cole outro só para trocar' : 'cole o token aqui'}">
      <small>${cfg.meta ? '<span style="color:var(--ok)">Configurado.</span> ' : ''}Traz gasto e conversas das contas de anúncios sozinho. Fica salvo só neste computador, fora do repo, e é conferido com a Meta antes de salvar.</small></div></div>
    <div class="erro" role="alert"></div>
    <div class="botoes"><button class="btn contorno" type="button" data-fechar>Fechar</button><button class="btn" type="submit">Salvar</button></div>`,
  f => {
    const token = String(f.get('fToken') || '').trim(), tMeta = String(f.get('fTokenMeta') || '').trim(), erro = $('janela').querySelector('.erro');
    if (!token && !tMeta) return cfg.token || cfg.meta ? 'Já configurado. Para trocar, cole o novo.' : 'Cole um token.';
    erro.textContent = 'Conferindo…';
    const enviar = (rota, t) => fetch(rota, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ token:t }) }).then(r => r.json());
    (async () => {
      if (token) { const res = await enviar('/api/token', token); if (res.erro) { erro.textContent = res.erro; return; } }
      if (tMeta) { const res = await enviar('/api/token-meta', tMeta); if (res.erro) { erro.textContent = res.erro; return; } }
      fechar(); avisar('Token salvo.' + (tMeta ? ' Buscando os dados da Meta…' : ' O Compartilhar já entrega o link.'));
      if (tMeta) atualizarMeta(true);
    })().catch(() => { erro.textContent = 'O servidor local não respondeu.'; });
  });
}

// ---------- eventos ----------
document.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.id) { S.atual = t.dataset.id; $('lateral').classList.remove('aberta'); render(); return; }
  if (t.dataset.aba) { S.aba = t.dataset.aba; $('tabVivo').innerHTML = htmlTabelas(conta(S.clientes[S.atual])); return; }
  const a = t.dataset.acao, c = S.clientes[S.atual];
  if (a === 'novoCliente') formCliente();
  if (a === 'editarCliente' && c) formCliente(c);
  if (a === 'compartilhar' && c) formCompartilhar(c);
  if (a === 'novaLeitura' && c) formLeitura(c);
  if (a === 'atualizarMeta') atualizarMeta(true);
  if (t.dataset.apagar && c) {
    if (!t.classList.contains('armado')) { t.classList.add('armado'); t.textContent = 'Confirmar'; setTimeout(() => { t.classList.remove('armado'); t.textContent = 'Excluir'; }, 3500); return; }
    salvarCliente({ ...c, leituras:(c.leituras || []).filter(l => l.id !== t.dataset.apagar) }).then(() => avisar('Leitura excluída.')).catch(() => {});
  }
});
$('btnNovoCliente').onclick = () => { $('lateral').classList.remove('aberta'); formCliente(); };
$('btnConfig').onclick = () => { $('lateral').classList.remove('aberta'); formConfig(); };
$('btnMenu').onclick = () => $('lateral').classList.toggle('aberta');
$('veu').addEventListener('click', ev => { if (ev.target === $('veu')) fechar(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('veu').hidden) fechar(); });

iniciar();
</script>
